name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Quality checks via the DCC-BS CI pipeline (mise run ci-check)
  # ---------------------------------------------------------------------------
  quality:
    uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@8b031be53aee5210c6b392115bd941c80e798d60 # v10.0.1
    permissions:
      contents: read
      pull-requests: write
    with:
      # `mise run test:unit` runs in the tests job below, which uploads coverage to Codecov.
      test-command: "echo 'Unit tests run in the tests job'"

  # ---------------------------------------------------------------------------
  # Tests + coverage
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [quality]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: DCC-BS/ci-workflows/actions/setup-mise@8b031be53aee5210c6b392115bd941c80e798d60 # v10.0.1

      - name: Run tests with coverage
        run: mise run test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
